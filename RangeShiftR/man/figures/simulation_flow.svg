<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1080" viewBox="0 0 680 1080" font-family="Helvetica, Arial, sans-serif" role="img"><title>Flow of a RangeShifter simulation</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="1080" fill="#FFFFFF"/><rect x="40" y="30" width="600" height="1004" rx="10" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="5 4"/><text x="60" y="55" text-anchor="start" font-size="14" font-weight="bold" fill="#2C2C2A">Each replicate</text><text x="620" y="54.2" text-anchor="end" font-size="12" fill="#5F5E5A">repeated Replicates times</text><rect x="110" y="68" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="250.0" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Initialise replicate</text><text x="250.0" y="109.2" text-anchor="middle" font-size="12" fill="#5F5E5A">Landscape, initial individuals</text><path d="M250 124 L250 180" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="60" y="146" width="560" height="792" rx="10" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="5 4"/><text x="80" y="171" text-anchor="start" font-size="14" font-weight="bold" fill="#2C2C2A">Each year</text><text x="600" y="170.2" text-anchor="end" font-size="12" fill="#5F5E5A">0 to Years − 1, stops at extinction</text><rect x="110" y="182" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="250.0" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Update environment</text><text x="250.0" y="223.2" text-anchor="middle" font-size="12" fill="#5F5E5A">Landscape changes, gradient, K</text><path d="M250 238 L250 296" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="80" y="262" width="520" height="506" rx="10" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="5 4"/><text x="100" y="287" text-anchor="start" font-size="14" font-weight="bold" fill="#2C2C2A">Each season</text><text x="580" y="286.2" text-anchor="end" font-size="12" fill="#5F5E5A">repeated RepSeasons times (reproductive seasons)</text><rect x="130" y="298" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="250.0" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Management</text><text x="250.0" y="339.2" text-anchor="middle" font-size="12" fill="#5F5E5A">Translocation, harvesting</text><rect x="390" y="313" width="200" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="490.0" y="330.2" text-anchor="middle" font-size="12" fill="#2C2C2A">First season only</text><path d="M250 354 L250 376" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="130" y="378" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="250.0" y="402" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Reproduction</text><text x="250.0" y="419.2" text-anchor="middle" font-size="12" fill="#0F6E56">Mating, gene inheritance</text><path d="M250 434 L250 454" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="130" y="456" width="240" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75" stroke-dasharray="4 3"/><text x="250.0" y="476" text-anchor="middle" font-size="14" font-weight="bold" fill="#712B13">Survival of adults</text><text x="250.0" y="493.2" text-anchor="middle" font-size="12" fill="#993C1D">SurvSched = 0; unstructured: all die</text><path d="M250 504 L250 520 L175 520 L175 538" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="100" y="540" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="175.0" y="564" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">Emigration</text><text x="175.0" y="581.2" text-anchor="middle" font-size="12" fill="#534AB7">Leave natal patch</text><path d="M250 568 L263 568" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="265" y="540" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="340.0" y="564" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">Transfer</text><text x="340.0" y="581.2" text-anchor="middle" font-size="12" fill="#534AB7">Kernel, SMS, CRW</text><path d="M415 568 L428 568" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="430" y="540" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="505.0" y="564" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">Settlement</text><text x="505.0" y="581.2" text-anchor="middle" font-size="12" fill="#534AB7">Stop or move on</text><path d="M505 596 L505 614 L250 614 L250 662" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="130" y="664" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/><text x="250.0" y="688" text-anchor="middle" font-size="14" font-weight="bold" fill="#712B13">Survival, development</text><text x="250.0" y="705.2" text-anchor="middle" font-size="12" fill="#993C1D">Deaths applied</text><rect x="390" y="626" width="200" height="40" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/><text x="490.0" y="642.2" text-anchor="middle" font-size="12" fill="#712B13">SurvSched = 0</text><text x="490.0" y="658.2" text-anchor="middle" font-size="12" fill="#712B13">survival of juveniles</text><rect x="390" y="672" width="200" height="40" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/><text x="490.0" y="688.2" text-anchor="middle" font-size="12" fill="#712B13">SurvSched = 1, unstructured</text><text x="490.0" y="704.2" text-anchor="middle" font-size="12" fill="#712B13">survival of all stages</text><rect x="390" y="718" width="200" height="40" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/><text x="490.0" y="734.2" text-anchor="middle" font-size="12" fill="#712B13">SurvSched = 2</text><text x="490.0" y="750.2" text-anchor="middle" font-size="12" fill="#712B13">development only</text><path d="M250 720 L250 788" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="150" y="790" width="200" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75" stroke-dasharray="4 3"/><text x="250.0" y="810" text-anchor="middle" font-size="14" font-weight="bold" fill="#712B13">Annual survival</text><text x="250.0" y="827.2" text-anchor="middle" font-size="12" fill="#993C1D">SurvSched = 2 only</text><path d="M250 838 L250 860" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="110" y="862" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="250.0" y="886" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">End of year</text><text x="250.0" y="903.2" text-anchor="middle" font-size="12" fill="#0F6E56">Ageing, maximum age</text><path d="M250 918 L250 956" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="110" y="958" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="250.0" y="982" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Final outputs</text><text x="250.0" y="999.2" text-anchor="middle" font-size="12" fill="#5F5E5A">Year = Years</text><rect x="40" y="1052" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/><text x="58" y="1062.2" text-anchor="start" font-size="12" fill="#444441">Survival</text><rect x="140" y="1052" width="12" height="12" rx="2" fill="none" stroke="#993C1D" stroke-width="0.75" stroke-dasharray="3 2"/><text x="158" y="1062.2" text-anchor="start" font-size="12" fill="#444441">Dashed: only in the cases given</text></svg>
