<svg xmlns="http://www.w3.org/2000/svg" width="680" height="750" viewBox="0 0 680 750" font-family="Helvetica, Arial, sans-serif" role="img"><title>Timing of RangeShifter outputs within a simulated year</title><rect x="0" y="0" width="680" height="750" fill="#FFFFFF"/><text x="145" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Step in year t</text><text x="360" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Non-structured</text><text x="550" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Stage-structured</text><line x1="40" y1="54" x2="640" y2="54" stroke="#B4B2A9" stroke-width="0.75"/><rect x="40" y="60" width="210" height="44" rx="4" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="145" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Start of year</text><text x="145" y="95.2" text-anchor="middle" font-size="12" fill="#5F5E5A">Landscape, K update</text><rect x="40" y="114" width="210" height="44" rx="4" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="145" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Management</text><text x="145" y="149.2" text-anchor="middle" font-size="12" fill="#5F5E5A">Translocation, harvesting</text><rect x="40" y="168" width="210" height="72" rx="4" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="145" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Before reproduction</text><rect x="275" y="175" width="170" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="360" y="192.2" text-anchor="middle" font-size="12" fill="#085041">Pop, Range, R object</text><rect x="275" y="207" width="170" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="360" y="224.2" text-anchor="middle" font-size="12" fill="#444441">Occupancy, Traits</text><rect x="465" y="191" width="170" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="550" y="208.2" text-anchor="middle" font-size="12" fill="#444441">Occupancy, Traits</text><rect x="40" y="250" width="210" height="44" rx="4" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="145" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Reproduction</text><rect x="40" y="304" width="210" height="44" rx="4" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="145" y="331" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">After reproduction</text><rect x="465" y="313" width="170" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="550" y="330.2" text-anchor="middle" font-size="12" fill="#085041">Pop, Range, R object</text><rect x="40" y="358" width="210" height="44" rx="4" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="145" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Emigration, dispersal</text><rect x="275" y="367" width="170" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="360" y="384.2" text-anchor="middle" font-size="12" fill="#444441">SMS paths</text><rect x="465" y="367" width="170" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="550" y="384.2" text-anchor="middle" font-size="12" fill="#444441">SMS paths</text><rect x="40" y="412" width="210" height="44" rx="4" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="145" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Survival determined</text><text x="145" y="447.2" text-anchor="middle" font-size="12" fill="#5F5E5A">not yet applied</text><rect x="275" y="421" width="170" height="26" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="360" y="438.2" text-anchor="middle" font-size="12" fill="#3C3489">Inds, genetics</text><rect x="465" y="421" width="170" height="26" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="550" y="438.2" text-anchor="middle" font-size="12" fill="#3C3489">Inds, genetics</text><rect x="40" y="466" width="210" height="44" rx="4" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="145" y="493" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Deaths applied</text><rect x="40" y="520" width="210" height="72" rx="4" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="145" y="551" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">End of year</text><text x="145" y="570.2" text-anchor="middle" font-size="12" fill="#5F5E5A">Annual survival, ageing</text><rect x="275" y="543" width="170" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="360" y="560.2" text-anchor="middle" font-size="12" fill="#444441">Connectivity (patch)</text><rect x="465" y="527" width="170" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="550" y="544.2" text-anchor="middle" font-size="12" fill="#444441">Connectivity (patch)</text><rect x="465" y="559" width="170" height="26" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="550" y="576.2" text-anchor="middle" font-size="12" fill="#3C3489">Inds (RepSeason -1)</text><line x1="40" y1="602" x2="640" y2="602" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/><rect x="40" y="612" width="210" height="72" rx="4" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="145" y="643" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">After the last year</text><text x="145" y="662.2" text-anchor="middle" font-size="12" fill="#5F5E5A">Year = Years</text><rect x="275" y="619" width="170" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="360" y="636.2" text-anchor="middle" font-size="12" fill="#085041">Pop, Range, R object</text><rect x="275" y="651" width="170" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="360" y="668.2" text-anchor="middle" font-size="12" fill="#444441">Occupancy, Traits</text><rect x="465" y="619" width="170" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="550" y="636.2" text-anchor="middle" font-size="12" fill="#085041">Pop, Range, R object</text><rect x="465" y="651" width="170" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="550" y="668.2" text-anchor="middle" font-size="12" fill="#444441">Occupancy, Traits</text><rect x="40" y="706" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="58" y="716.2" font-size="12" fill="#444441">Population</text><rect x="160" y="706" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="178" y="716.2" font-size="12" fill="#444441">Individuals and genetics</text><rect x="350" y="706" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="368" y="716.2" font-size="12" fill="#444441">Other outputs</text><text x="40" y="740.2" font-size="12" fill="#444441">Steps from management to deaths are repeated in every reproductive season.</text></svg>
